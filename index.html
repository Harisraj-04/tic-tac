<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe - 2 Players</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}
body{
    background:#1f2937;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.container{
    text-align:center;
}
h1{
    margin-bottom:15px;
}
.scoreboard{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}
.score{
    background:#374151;
    padding:12px 20px;
    border-radius:10px;
    min-width:130px;
}
#status{
    margin-bottom:20px;
    font-size:22px;
    font-weight:bold;
    color:#facc15;
}
.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:8px;
    justify-content:center;
}
.cell{
    width:100px;
    height:100px;
    background:#4b5563;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    cursor:pointer;
    border-radius:10px;
    transition:.3s;
}
.cell:hover{
    background:#6b7280;
}
button{
    margin-top:20px;
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#22c55e;
    color:white;
}
button:hover{
    background:#16a34a;
}
</style>

</head>
<body>

<div class="container">

<h1>🎮 Tic Tac Toe</h1>

<div class="scoreboard">
    <div class="score">
        <h3>Player X</h3>
        <h2 id="scoreX">0</h2>
    </div>

    <div class="score">
        <h3>Draws</h3>
        <h2 id="drawScore">0</h2>
    </div>

    <div class="score">
        <h3>Player O</h3>
        <h2 id="scoreO">0</h2>
    </div>
</div>

<div id="status">Player X Turn</div>

<div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
</div>

<button onclick="resetGame()">Reset Match</button>

</div>

<script>

const cells=document.querySelectorAll(".cell");
const statusText=document.getElementById("status");

let board=["","","","","","","","",""];
let currentPlayer="X";
let gameActive=true;

let scoreX=0;
let scoreO=0;
let drawScore=0;

const wins=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

cells.forEach(cell=>{
    cell.addEventListener("click",cellClick);
});

function cellClick(){

    const index=this.dataset.index;

    if(board[index]!=="" || !gameActive)
        return;

    board[index]=currentPlayer;
    this.textContent=currentPlayer;

    checkWinner();
}

function checkWinner(){

    let winner=false;

    for(let pattern of wins){

        const[a,b,c]=pattern;

        if(board[a]==="" || board[b]==="" || board[c]==="")
            continue;

        if(board[a]===board[b] && board[b]===board[c]){

            winner=true;
            gameActive=false;

            if(currentPlayer==="X"){
                scoreX++;
                document.getElementById("scoreX").textContent=scoreX;
            }
            else{
                scoreO++;
                document.getElementById("scoreO").textContent=scoreO;
            }

            statusText.textContent="🎉 Player "+currentPlayer+" Wins!";

            setTimeout(()=>{
                autoRestart();
            },1500);

            return;
        }
    }

    if(!board.includes("")){

        drawScore++;
        document.getElementById("drawScore").textContent=drawScore;
        gameActive=false;
        statusText.textContent="🤝 Draw!";

        setTimeout(()=>{
            autoRestart();
        },1500);

        return;
    }

    currentPlayer=currentPlayer==="X"?"O":"X";
    statusText.textContent="Player "+currentPlayer+" Turn";
}

function autoRestart(){

    board=["","","","","","","","",""];

    cells.forEach(cell=>{
        cell.textContent="";
    });

    currentPlayer="X";
    gameActive=true;
    statusText.textContent="Player X Turn";
}

function resetGame(){

    scoreX=0;
    scoreO=0;
    drawScore=0;

    document.getElementById("scoreX").textContent=0;
    document.getElementById("scoreO").textContent=0;
    document.getElementById("drawScore").textContent=0;

    autoRestart();
}

</script>

</body>
</html>
